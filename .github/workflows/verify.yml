name: Verify source and synthetic tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check publication contents
        run: python -I scripts/check_source_tree.py
      - name: Restore managed project
        run: dotnet restore CompatPrep.csproj --configfile NuGet.Config
      - name: Build managed project
        run: dotnet build CompatPrep.csproj -c Release --no-restore
      - name: Run synthetic PE and package checks
        run: dotnet bin/Release/net10.0/CompatPrep.dll selftest
      - name: Run native desktop and memory checks
        shell: powershell
        run: .\native\Build-Native.ps1
